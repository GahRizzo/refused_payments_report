[project]
name = "refused-payments-report"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "GahRizzo", email = "62845690+GahRizzo@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyspark>=4.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
refused-payments-report = "refused-payments-report:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["refused_payments_report"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80