[project]
name = "refused-payments-report"
version = "0.1.0"
description = "Pipeline de dados em PySpark para processamento e análise de pagamentos recusados, com validações de qualidade e geração de relatórios em Parquet."
readme = "README.md"
authors = [
    { name = "GahRizzo", email = "62845690+GahRizzo@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "pyspark>=4.2.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
refused-payments-report = "refused_payments_report.main:cli"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "black>=26.10.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["refused_payments_report"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.black]
line-length = 88
target-version = ["py314"]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = [
    "E4",  # Erros de estilo relevantes
    "E7",  # Problemas em instruções e comparações
    "E9",  # Erros de sintaxe
    "F",   # Pyflakes: variáveis e imports
    "I",   # Organização dos imports
    "B",   # Possíveis bugs
]

[tool.uv.build-backend]
source-include = [
    "config/**",
    "data/input/**",
    "tests/**",
]

source-exclude = [
    ".venv/**",
    ".ruff_cache/**",
    ".pytest_cache/**",
    "htmlcov/**",
    "data/output/**",
    "dist/**",
    "build/**",
]