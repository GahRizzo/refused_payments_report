spark:
  app_name: "refused-payments-report"

paths:
  pagamentos: "./data/input/dataset-json-pagamentos/data/pagamentos/"
  pedidos: "./data/input/datasets-csv-pedidos/data/pedidos/"
  output: "./data/output/refused_payments_report"

file_options:
  pagamentos_json:
    compression: "gzip"
  pedidos_csv:
    compression: "gzip"
    header: True
    sep: ";"

transformer:
  target_year: 2025