spark:
  app_name: "refused-payments-report"

paths:
  pagamentos: "./data/input/dataset-json-pagamentos/data/pagamentos/"
  pedidos: "./data/input/datasets-csv-pedidos/data/pedidos/"
  output: "./data/output/refused_payments_report"

file_options:
  pagamentos_json:
    compression: "gzip"
  pedidos_csv:
    compression: "gzip"
    header: True
    sep: ";"

transformer:
  target_year: 2025

logging:
  version: 1
  disable_existing_loggers: False
  formatters:
    padrao:
      format: "%(asctime)s - %(name)s - %(levelname)s - %(message)s"
      datefmt: "%Y-%m-%d %H:%M:%S"
  handlers:
    console:
      class: logging.StreamHandler
      level: INFO
      formatter: padrao
      stream: ext://sys.stdout
    file:
      class: logging.FileHandler
      level: INFO
      formatter: padrao
      filename: "dataeng-pyspark-poo.log"
  root:
    level: INFO
    handlers: [console, file]